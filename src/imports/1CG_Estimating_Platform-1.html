document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);  4vw, 54px)/1.04 var(--font-heading)\">BIDS, TASKS AND THE PIPELINE IN ONE PLACE.<\u002Fdiv>\n        <div style=\"width:88px;height:4px;background:var(--color-accent)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 12px/1.6 var(--font-body);color:var(--color-neutral-400);max-width:44ch;text-wrap:pretty\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:56px 44px;display:flex;flex-direction:column;justify-content:center;gap:22px;border-left:2px solid var(--color-text)\">\n\n      <sc-if value=\"{{ loginMode }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font:800 26px/1.05 var(--font-heading)\">SIGN IN<\u002Fdiv>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700)\">Your work email and password.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label style=\"font:500 11px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">GLASS1ST EMAIL<\u002Flabel>\n            <input value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\" placeholder=\"firstlast@glass1st.net\" style=\"padding:12px;border:1px solid var(--color-text);background:var(--color-neutral-100);font:400 14px/1 var(--font-body)\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label style=\"font:500 11px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">PASSWORD<\u002Flabel>\n            <input type=\"password\" value=\"{{ authPw }}\" sc-camel-on-change=\"{{ onAuthPw }}\" placeholder=\"••••••••\" style=\"padding:12px;border:1px solid var(--color-text);background:var(--color-neutral-100);font:400 14px/1 var(--font-body)\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ ;flex-direction:column;border-top:1px solid var(--color-divider)\">\n                  <sc-for list=\"{{ deal.contacts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;flex-direction:column;gap:4px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n                      <div style=\"font:600 14.5px/1.25 var(--font-body)\">{{ c.name }} <span style=\"font:400 12.5px/1 var(--font-body);color:var(--color-neutral-600)\">· {{ c.title }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"font:400 12.5px/1.3 var(--font-body);color:var(--color-neutral-700)\">{{ c.email }} · {{ c.phone }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font:800 14px/1 var(--font-heading);padding-top:6px\">OPEN TASKS<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n                  <sc-for list=\"{{ deal.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n                      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\">\n                        <div style=\"font:600 13.5px/1.3 var(--font-body);text-wrap:pretty\">{{ t.title }}<\u002Fdiv>\n                        <div style=\"font:400 11.5px/1 var(--font-body);color:var(--color-neutral-600)\">{{ t.whoName }} · {{ t.due }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"{{ t.chipStyle }}\">{{ t.statusShort }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ panePricing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column\">\n              <div style=\"padding:24px 28px;border-bottom:1px solid var(--color-divider);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px\">\n                <div style=\"display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"font:800 14px/1 var(--font-heading)\">FINAL PRICING<\u002Fdiv>\n                  <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--color-divider)\">\n                      <div style=\"padding:12px 0;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--color-divider)\">\n                        <div style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">SELL PRICE<\u002Fdiv>\n                        <div style=\"font:800 24px/1 var(--font-heading);white-space:nowrap\">{{ deal.priceDisplay }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"padding:12px 0 12px 14px;display:flex;flex-direction:column;gap:4px\">\n                        <div style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">COST<\u002Fdiv>\n                        <div style=\"font:800 24px/1 var(--font-heading);white-space:nowrap\">{{ deal.costDisplay }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                      <div style=\"display:flex;flex-direction:column;gap:6px\">\n                        <label style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">SELL PRICE<\u002Flabel>\n                        <input value=\"{{ deal.price }}\" dth:100%;background:var(--color-neutral-300)\">\n                      <div style=\"{{ deal.gpBarStyle }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font:400 12.5px/1.4 var(--font-body);color:var(--color-neutral-700)\">{{ deal.gpNote }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:14px\">\n                  <div style=\"font:800 14px/1 var(--font-heading)\">LOG A REVISION<\u002Fdiv>\n                  <sc-if value=\"{{ costPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"{{ costPromptStyle }}\">{{ costPrompt }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <label style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">REASON<\u002Flabel>\n                      <input value=\"{{ revLabel }}\" sc-camel-on-change=\"{{ onRevLabel }}\" placeholder=\"e.g. Addendum 3\" style=\"padding:10px 12px;border:1px solid var(--color-text);background:var(--color-bg);font:400 14.5px/1 var(--font-body)\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <label style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">SELL PRICE<\u002Flabel>\n                      <input value=\"{{ revPrice }}\" sc-camel-on-change=\"{{ onRevPrice }}\" placeholder=\"0\" style=\"padding:10px 12px;border:1px solid var(--color-text);background:var(--color-bg);font:600 14.5px/1 var(--font-body)\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <label style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">COST · REQUIRED FOR GP<\u002Flabel>\n                      <input value=\"{{ revCost }}\" sc-camel-on-change=\"{{ onRevCost }}\" placeholder=\"0\" style=\"{{ revCostStyle }}\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <label style=\"font:500 11.5px/1 var(--font-body);letter-spacing:.12em;color:var(--color-neutral-600)\">NOTE<\u002Flabel>\n                      <input value=\"{{ revNote }}\" sc-camel-on-change=\"{{ onRevNote }}\" placeholder=\"What changed\" style=\"padding:10px 12px;border:1px solid var(--color-text);background:var(--color-bg);font:400 14.5px/1 var(--font-body)\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ onAddRevision }}\" style=\"align-self:flex-start;padding:11px 16px;background:var(--color-accent);color:#fff;border:none;font:600 13.5px/1 var(--font-body);letter-spacing:.06em;cursor:pointer;text-align:left;white-space:nowrap\" style-hover=\"background:var(--color-accent-600)\">LOG REVISION {{ nextRev }}<\u002Fbutton>\n                  <div style=\"font:400 12.5px/1.45 var(--font-body);color:var(--color-neutral-700);text-wrap:pretty\">The newest revision becomes the project's carried price and stamps the log with the date, time and who entered it.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:24px 28px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <div style=\"font:800 14px/1 var(--font-heading)\">REVISION HISTORY<\u002Fdiv>\n                  <div style=\"font:400 12.5px/1 var(--font-body);color:var(--color-neutral-600)\">{{ revCount }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:56px minmax(0,1.2fr) 116px 116px 76px 150px;gap:14 (m[3]);\n}\n\n// Pull the accepted, assigned bids out of the Bid Board's saved board (same browser).\nfunction readBoard() {\n  try {\n    const raw = window.localStorage.getItem(BOARD_KEY);\n    if (!raw) return [];\n    const saved = JSON.parse(raw);\n    const list = (saved && saved.projects) || [];\n    return list.filter(p => p.status === 'accepted').map((p, i) => {\n      const gcs = p.gcs && p.gcs.length ? p.gcs : [{ name: p.gc || '—', date: p.bidDate || '' }];\n      const dates = gcs.map(g => g.date).filter(Boolean).sort();\n      return {\n        id: 'bb-' + p.id,\n        fromBoard: true,\n        ref: 'BOARD-' + String(i + 1).padStart(2, '0'),\n        name: p.name,\n        short: p.name.length > 26 ? p.name.slice(0, 24) + '…' : p.name,\n        client: gcs.map(g => g.name).join(' · '),\n        scope: p.scope || 'Scope TBD',\n        bidDue: prettyDate(dates[0] || (gcs[0] && gcs[0].date)),\n        value: p.level || 'N/A',\n        bidTab: 'BOARD',\n        glazier: (p.assignees || []).join(', ') || 'unassigned',\n        sqft: p.location || '—',\n        location: p.location || '—',\n        assignees: p.assignees || [],\n        docStage: docStageFrom(p.level),\n        loggedAt: p.loggedAt || 'from board',\n        itbUrl: p.planRoom || p.planRoomUrl || p.itbUrl || p.link || '',\n        itbSubject: p.itbSubject || p.subject || '',\n        rawDue: dates[0] || (gcs[0] && gcs[0].date) || '',\n        rawAssignedAt: p.assignedAt || '',\n        assignedAt: p.assignedAt ? new Date(p.assignedAt).toLocaleDateString([], { month: 'short', day: '2-digit' }) : 'not assigned'\n      };\n    });\n  } catch (e) { return []; }\n}\n\n// CRM: one account per general contractor we bid to.\nconst ACCOUNTS = [\n  { id: 'harmon', name: 'Harmon Construction', region: 'Charlotte, NC', tier: 'Key account', clientOf: 'Harmon Construction',\n    summary: 'Six invitations this year, three awarded. Prefers a scope letter attached to every number.',\n    won: 3, lost: 1, inv onth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\nfunction monday(d) { return addD(d, -((d.getDay() + 6) % 7)); }\nfunction workday(d) { const g = d.getDay(); return g === 6 ? addD(d, -1) : g === 0 ? addD(d, 1) : d; }\nfunction prettyShort(d) { return d.toLocaleDateString([], { month: 'short', day: '2-digit' }); }\nfunction dayKeyOf(d) { return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()]; }\nconst WEEKHEAD = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];\nconst WHO_COLOR = { blake: 'var(--color-text)', allen: 'var(--color-accent)', nico: 'var(--color-accent-700)' };\n\n// Every task gets a real calendar date: auto tasks carry one, seed tasks parse from \"Aug 12\".\nfunction taskDate(t) {\n  if (t.date) return fromYmd(t.date);\n  const m = /^([A-Za-z]{3})\\s+(\\d{1,2})$/.exec(String(t.due || '').trim());\n  if (!m) return null;\n  const mi = MONTHS.indexOf(m[1].slice(0, 1).toUpperCase() + m[1].slice(1, 3).toLowerCase());\n  if (mi < 0) return null;\n  return new Date(new Date().getFullYear(), mi, Number(m[2]));\n}\n\n// Standing schedule written for every project pulled off the board.\nconst AUTO_STEPS = [\n  { key: 'intro', hrs: 1, title: 'Send out intro email', detail: 'Introduce ourselves to the GC, confirm we are bidding and ask for anything missing from the plan set. Auto-scheduled the day after assignment.' },\n  { key: 'takeoff', hrs: 6, title: 'Takeoff + RFQs out', detail: 'Full quantity takeoff and RFQs to glass, metal and hardware suppliers. Auto-scheduled two days after assignment.' },\n  { key: 'sheet', hrs: 2, title: 'Assemble + review estimate sheet', detail: 'Roll the returned quotes into the estimate sheet and review the numbers. Auto-scheduled the day before the bid is due.' },\n  { key: 'final', hrs: 4, title: 'Finalize proposal + estimate', detail: 'Final pricing, scope letter and proposal out the door. Auto-scheduled the day the bid is due.' }\n];\nfunction autoTasksFor(bid, existing) {\n  const due = toDate(bid.rawDue);\n  const assigned = toDate(bid.rawAssignedAt) || (due ? addD(due, -7) : new Date());\n  const anchor = due || addD(assigned, 14);\n  const when = { intro: workday(addD(assigned, 1)), takeoff: workday(addD(assigned, 2)), sheet: workday(addD(anchor, -1)), final: workday(anchor) };\n  const first = String((bid.assignees || [])[0] || '').toLowerCase();\n  const person = PEOPLE.find(p => first && (p.name.toLowerCase() === first || first.indexOf(p.first.toLowerCase()) === 0));\n  const who = person ? person.id : 'blake';\n  return AUTO_STEPS.map(step => {\n    const id = 'auto-' + bid.id + '-' + step.key;\n    if (existing.some(t => t.id === id)) return null;\n    const d = when[step.key];\n    return {\n      id: id, title: step.title, projectId: bid.id, who: who, status: 'To-Do',\n      due: prettyShort(d), day: dayKeyOf(d), hrs: step.hrs, date: ymd(d),\n      auto: true, detail: step.detail, notes: []\n    };\n  }).filter(Boolean);\n}\n\nclass Component extends DCLogic {\n  state = {\n    userId: null,\n    authed: false,\n    authMode: 'login',\n    authEmail: '',\n    authPw: '',\n    authPw2: '',\n    authCode: '',\n    authSent: '',\n    authError: '',\n    view: 'overview',\n    mgr: 'signals',\n    est: 'today',\n    metaphor: 'board',\n    tasks: mkTasks(),\n    projectId: 'cedar',\n    app: 'tracker',\n    projPane: 'tasks',\n    projNotes: {},\n    projNoteDraft: '',\n    projNoteTag: 'spec',\n    showQuickNote: false,\n    quickNote: { projectId: '', text: '', tag: 'spec' },\n    listening: false,\n    hoverDay: null,\n    issues: [],\n    issueDraft: '',\n    replyFor: null,\n    replyDraft: '',\n    showIssues: false,\n    mgrPin: null,\n    closedProjects: {},\n    confirmClose: null,\n    mgrNoteFor: null,\n    mgrNoteDraft: '',\n    focusProjectId: null,\n    calMode: 'week',\n    calWho: 'all',\n    calOff: null,\n    teamMode: 'week',\n    teamWho: 'all',\n    teamOff: null,\n    board: [],\n    dealId: 'cedar',\n    crmOpen: fa k II · window count marked complete → tab line 04 updated.' },\n      { what: 'Follow-up date written', when: 'Mon 4:06 PM', detail: 'Cedar Point · Oldcastle glass quote → Aug 13 follow-up on the tab.' },\n      { what: 'New bid detected', when: 'Fri 5:02 PM', detail: 'Tempe Logistics Center Bldg C added — 2 starter tasks created.' }\n    ]\n  };\n\n  // Demo auth: accounts live in localStorage keyed by the Glass1st address.\n  users() {\n    try { return JSON.parse(window.localStorage.getItem(AUTH_KEY) || '{}') || {}; } catch (e) { return {}; }\n  }\n  saveUsers(u) { try { window.localStorage.setItem(AUTH_KEY, JSON.stringify(u)); } catch (e) {} }\n  personByEmail(v) {\n    const e = String(v || '').trim().toLowerCase();\n    return PEOPLE.find(p => (p.email || '').toLowerCase() === e) || null;\n  }\n  signIn() {\n    const s = this.state;\n    const person = this.personByEmail(s.authEmail);\n    if (!person) return this.setState({ authError: 'No Glass1st account for that address.' });\n    const u = this.users();\n    const rec = u[person.id];\n    const pw = String(s.authPw || '');\n    if (!pw) return this.setState({ authError: 'Enter your password.' });\n    if (rec && rec.pw && rec.pw !== pw) return this.setState({ authError: 'That password does not match.' });\n    if (!rec || !rec.pw) { u[person.id] = { pw: pw }; this.saveUsers(u); }\n    try { window.localStorage.setItem(SESSION_KEY, person.id); } catch (e) {}\n    this.setState({\n      authed: true, userId: person.id, authError: '', authPw: '', authPw2: '', authCode: '',\n      view: person.kind === 'estimator' ? 'myday' : 'overview',\n      focusProjectId: null\n    });\n    this.flash('Signed in as ' + person.name);\n  }\n  signOut() {\n    try { window.localStorage.removeItem(SESSION_KEY); } catch (e) {}\n    this.setState({ authed: false, userId: null, authMode: 'login', authEmail: '', authPw: '', authError: '' });\n  }\n  requestReset() {\n    const person = this.personByEmail(this.state.authEmail);\n    if (!person) return this.setState({ authError: 'No Glass1st account for that address.' });\n    const code = String(Math.floor(100000 + Math.random() * 900000));\n    const u = this.users();\n    u[person.id] = Object.assign({}, u[person.id] || {}, { code: code });\n    this.saveUsers(u);\n    this.setState({ authMode: 'reset', authSent: code, authError: '', authPw: '', authPw2: '', authCode: '' });\n    this.flash('Reset code sent to ' + person.email);\n  }\n  completeReset() {\n    const s = this.state;\n    const person = this.personByEmail(s.authEmail);\n    if (!person) return this.setState({ authError: 'No Glass1st account for that address.' });\n    const u = this.users();\n    const rec = u[person.id] || {};\n    if (!s.authCode || s.authCode.trim() !== rec.code) return this.setState({ authError: 'That reset code is not right.' });\n    if (String(s.authPw).length < 6) return this.setState({ authError: 'Use at least six characters.' });\n    if (s.authPw !== s.authPw2) return this.setState({ authError: 'The two passwords do not match.' });\n    u[person.id] = { pw: s.authPw };\n    this.saveUsers(u);\n    this.setState({ authMode: 'login', authPw: '', authPw2: '', authCode: '', authSent: '', authError: '' });\n    this.flash('Password updated \\u2014 sign in with it');\n  }\n\n  componentDidMount() {\n    try {\n      const sid = window.localStorage.getItem(SESSION_KEY);\n      if (sid && PEOPLE.some(p => p.id === sid)) {\n        const person = PEOPLE.find(p => p.id === sid);\n        this.setState({ authed: true, userId: sid, view: person.kind === 'estimator' ? 'myday' : 'overview' });\n      }\n    } catch (e) {}\n    this.pullBoard(true);\n    // New assignments on the board write their three dated auto tasks into the list without a manual pull.\n    this._onStore = e => { if (!e.key || e.key === BOARD_KEY) this.pullBoard(true); };\n    window.addEventListener('storage', this._onStore);\n    this._poll = setInterval(() => this.pullBoard(true), 6000);\n    if (this.props.startView) this.setState({ view: this.props.startView });\n    if (this.props.managerLayout) this.setState({ mgr: this.props.managerLayout });\n    if (this.props.estimatorLayout) this.setState({ est: this.props.estimatorLayout });\n    if (this.props.taskMetaphor) this.setState({ metaphor: this.props.taskMetaphor });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('storage', this._onStore);\n    clearInterval(this._poll);\n    clearTimeout(this._t);\n  }\n\n  toggleDictation() {\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if (!SR) return this.flash('This browser has no built-in dictation — type the note');\n    if (this._rec && this.state.listening) { this._rec.stop(); return; }\n    const rec = new SR();\n    this._rec = rec;\n    rec.continuous = true;\n    rec.interimResults = false;\n    rec.lang = 'en-US';\n    rec.onresult = e => {\n      let add = '';\n      for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) add += e.results[i][0].transcript;\n      if (!add.trim()) return;\n      this.setState(st => {\n        const prev = st.quickNote.text;\n        return { quickNote: Object.assign({}, st.quickNote, { text: (prev ? prev.replace(/\\s+$/, '') + ' ' : '') + add.trim() }) };\n      });\n    };\n    rec.onerror = ev => { this.setState({ listening: false }); this.flash(ev.error === 'not-allowed' ? 'Microphone blocked — allow access to dictate' : 'Dictation stopped'); };\n    rec.onend = () => this.setState({ listening: false });\n    try { rec.start(); this.setState({ listening: true }); this.flash('Listening — speak your note'); }\n    catch (e) { this.setState({ listening: false }); this.flash('Could not start the mic'); }\n  }\n\n  // Download the shown schedule as an .ics so it can be added to Outlook or Google.\n  exportIcs(all, whoId) {\n    const rows = all.filter(t => (whoId === 'all' || t.who === whoId) && t.status !== 'Complete');\n    const line ue sent to Blake' + (t ? ' · ' + t.title : ''));\n  }\n  replyIssue(id, text) {\n    const body = String(text || '').trim();\n    if (!body) return this.flash('Write a reply first');\n    const who = this.me().name;\n    const when = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });\n    this.setState(st => {\n      const iss = st.issues.find(i => i.id === id);\n      return {\n        replyDraft: '', replyFor: null,\n        issues: st.issues.map(i => i.id === id ? Object.assign({}, i, { replies: (i.replies || []).concat([{ who: who, when: when, text: body }]) }) : i),\n        tasks: st.tasks.map(t => iss && t.id === iss.taskId ? Object.assign({}, t, {\n          notes: (t.notes || []).concat([{ who: who, when: 'Just now', text: 'REPLY — ' + body }])\n        }) : t)\n      };\n    });\n    this.flash('Reply sent to the estimator');\n  }\n  resolveIssue(id) {\n    this.setState(st => ({ issues: st.issues.map(i => i.id === id ? Object.assign({}, i, { status: 'resolved' }) : i) }));\n    this.flash('Issue closed');\n  }\n\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n\n  pullBoard(quiet) {\n    const bids = readBoard();\n    let made = 0;\n    this.setState(st => {\n      let tasks = st.tasks;\n      bids.forEach(b => {\n        const fresh = autoTasksFor(b, tasks);\n        if (fresh.length) { tasks = tasks.concat(fresh); made += fresh.length; }\n      });\n      return { board: bids, tasks: tasks };\n    });\n    if (!quiet) this.flash(bids.length\n      ? 'Pulled ' + bids.length + ' accepted bids' + (made ? ' · ' + made + ' tasks scheduled' : '')\n      : 'No accepted bids on the board yet');\n  }\n  // Minimized status list of every active assigned project. Green = good for now,\n  // yellow = awaiting response, red = needs current work.\n  focusList(all) {\n    const s = this.state;\n    const LIGHT = {\n      green: { dot: 'oklch(0.58 0.12 150)', word: 'GOOD FOR NOW' },\n      yellow: { dot: 'oklch(0.72 0.15 78)', word: 'AWAITING' },\n      red: { dot: 'var(--color-accent)', word: 'NEEDS WORK' }\n    };\n    const openT = t => t.status !== 'Complete';\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const soon = addD(today, 2);\n    return this.visibleProjects().map(p => {\n      const ts = all.filter(t => t.projectId === p.id && (this.isManager() || t.who === s.userId));\n      if (!ts.length) return null;\n      const live = ts.filter(openT);\n      const waiting = live.filter(t => t.status === 'Awaiting Response');\n      const active = live.filter(t => t.status === 'To-Do' || t.status === 'In Progress');\n      // Red only when something is actually on the clock: an active task due today or past,\n      // or the bid itself landing inside two days.\n      const dueDate = seedShiftDate(p.bidDue) || taskDate({ due: p.bidDue });\n      const hot = active.some(t => { const d = taskDate(t); return d && d <= today; }) || !!(dueDate && dueDate <= soon && active.length);\n      const key = hot ? 'red' : waiting.length ? 'yellow' : 'green';\n      const lead = (hot ? active : waiting.concat(active))[0] || null;\n      const note = !live.length ? 'All tasks closed'\n        : key === 'yellow' ? 'Awaiting ' + (lead.title.toLowerCase().indexOf('quote') > -1 ? 'supplier quote' : 'GC response')\n        : key === 'red' ? lead.title : 'Scheduled — nothing due yet';\n      const hrs = live.reduce((a, t) => a + (t.hrs || 0), 0);\n      const ref = /^[A-Z]{2,}-\\d+$/.test(String(p.ref || '')) ? p.ref : 'BOARD';\n      return {\n        name: p.short || p.name, ref: ref,\n        dot: LIGHT[key].dot, word: LIGHT[key].word, note: note,\n        owners: Array.from(new Set(live.map(t => (PEOPLE.find(x => x.id === t.who) || {}).first).filter(Boolean))).join(', ') || 'unassigned',\n        meta: live.length + ' open · ' + hrs + ' h · bid due ' + (dueDate ? prettyShort(dueDate) : (p.bidDue || '— d), hrs = hrsOn(key), items = itemsOn(key);\n            const inMonth = d.getMonth() === anchor.getMonth();\n            if (inMonth) total += hrs;\n            return {\n              num: String(d.getDate()), hrs: hrs, hrsLabel: hrs ? hrs + ' h' : '',\n              items: items.slice(0, 3), more: items.length > 3 ? '+' + (items.length - 3) + ' more' : '',\n              style: {\n                display: 'flex', flexDirection: 'column', gap: '5px', padding: '8px 9px',\n                borderLeft: '1px solid var(--color-divider)', borderTop: '1px solid var(--color-divider)',\n                minHeight: '116px', opacity: inMonth ? 1 : 0.35,\n                background: key === ymd(today) ? 'var(--color-neutral-100)' : 'var(--color-bg)'\n              },\n              numStyle: {\n                font: (key === ymd(today) ? '800' : '500') + ' 12px/1 var(--font-heading)',\n                color: key === ymd(today) ? 'var(--color-accent)' : 'var(--color-text)'\n              }\n            };\n          })\n        });\n      }\n      title = anchor.toLocaleDateString([], { month: 'long', year: 'numeric' }).toUpperCase();\n    }\n    return {\n      calTitle: title, calWeekCells: cells, calMonthWeeks: weeks, calHead: WEEKHEAD,\n      calIsWeek: mode === 'week', calIsMonth: mode === 'month',\n      calTotal: total + ' h scheduled',\n      calModes: [['week', 'WEEK'], ['month', 'MONTH']].map(o => ({\n        label: o[1], style: segStyle(mode === o[0]),\n        onPick: () => this.setState({ [modeKey]: o[0], [offKey]: null })\n      })),\n      calWhoOpts: [{ id: 'all', initials: 'ALL' }].concat(this.team()).map(p => ({\n        label: p.initials, style: segStyle(whoId === p.id),\n        onPick: () => this.setState({ calWho: p.id })\n      })),\n      onCalPrev: () => this.setState({ [offKey]: off - 1 }),\n      onCalNext: () => this.setState({ [offKey]: off + 1 }),\n      onCalToday: () => this.setState({ [offKey]: 0 })\n    };\n  }\n  // Closing a bid out drops it o dAt: '—', assignedAt: 'not assigned' }; }\n  setDeal(patch) {\n    const id = this.state.dealId;\n    this.setState(st => {\n      const bp = (st.board || []).find(b => b.id === id) || {};\n      const base = st.deals[id] || { estimator: (bp.assignees || [])[0] || '', manager: '', bd: '', stage: 'Bidding', docStage: bp.docStage || 'SD', price: '', cost: '', loggedAt: bp.loggedAt || '—', assignedAt: bp.assignedAt || 'not assigned' };\n      const next = Object.assign({}, base, patch);\n      if (patch.estimator && patch.estimator !== base.estimator) {\n        next.assignedAt = new Date().toLocaleDateString([], { month: 'short', day: '2-digit' });\n      }\n      return { deals: Object.assign({}, st.deals, { [id]: next }) };\n    });\n  }\n  accountFor(client) { return ACCOUNTS.find(a => (client || '').indexOf(a.clientOf) > -1) || null; }\n  addRevision() {\n    const d = this.state.revDraft;\n    const id = this.state.dealId;\n    if (!num(d.price)) return this.flash('Enter the revised sell price');\n    if (!num(d.cost)) return this.flash('Enter the cost so this revision carries a GP');\n    const rev = 'R' + (this.state.revisions[id] || []).length;\n    const when = new Date().toLocaleString([], { month: 'short', day: '2-digit', hour: 'numeric', minute: '2-digit' });\n    const entry = { rev: rev, label: d.label.trim() || 'Revision', price: String(num(d.price)), cost: String(num(d.cost)), when: when, who: this.me().name, note: d.note.trim() };\n    this.setState(st => ({\n      revisions: Object.assign({}, st.revisions, { [id]: (st.revisions[id] || []).concat([entry]) }),\n      revDraft: { label: '', price: '', cost: '', note: '' },\n      deals: Object.assign({}, st.deals, { [id]: Object.assign({}, st.deals[id] || {}, { price: entry.price, cost: entry.cost }) })\n    }));\n    this.logActivity(rev + ' logged — ' + entry.label + ' at ' + money(num(entry.price)) + '. ' + (entry.note || ''), true);\n    this.flash(rev + ' logged · price now ' + money(num(entry.price)));\n  }\n  readProposalFile(file) {\n    if (!file) return;\n    const id = this.state.dealId;\n    const submitted = new Date().toLocaleDateString([], { month: 'short', day: '2-digit', year: 'numeric' });\n    const kb = Math.max(1, Math.round(file.size / 1024));\n    const entry = { id: 'pf' + Date.now(), name: file.name, submitted: submitted, size: kb + ' KB', by: this.me().name };\n    this.setState(st => ({\n      proposalName: file.name,\n      proposalFiles: Object.assign({}, st.proposalFiles, { [id]: ((st.proposalFiles || {})[id] || []).concat([entry]) })\n    }));\n    this.logActivity('Proposal uploaded — ' + file.name + ' (submitted ' + submitted + ')', true);\n    this.flash('Saved ' + file.name + ' · submitted ' + submitted);\n    if (/\\.pdf$/i.test(file.name)) {\n      this.flash('PDF saved — paste its scope text below to autofill');\n      return;\n    }\n    const r = new FileReader();\n    r.onload = () => this.setState({ proposalText: String(r.result || '').slice(0, 12000) });\n    r.readAsText(file);\n  }\n  runProposalAi() {\n    const txt = (this.state.proposalText || '').trim();\n    if (!txt) return this.flash('Upload or paste the proposal first');\n    if (this.state.proposalBusy) return;\n    const id = this.state.dealId;\n    const project = this.project(id);\n    this.setState({ proposalBusy: true });\n    const ask = 'You are reading a glass and glazing (Division 08) proposal. Reply with ONLY a JSON object, no prose, keys: '\n      + 'scope (2 sentences on the trade scope), inclusions (short comma list), exclusions (short comma list), '\n      + 'alternates (short list or \"none stated\"), lead (lead time or \"not stated\"), price (the proposal total as written, or \"not stated\"), '\n      + 'risk (one short internal caution). Use \"not stated\" when the document does not say.\\n\\nPROPOSAL:\\n' + txt.slice(0, 8000);\n    const finish = data => {\n      const when = new Date().toLocaleString([], { month: 'short', day: '2-digit', hour
